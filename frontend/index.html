<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FocusAI Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top, #1a0033, #000000);
      color: white;
      text-align: center;
    }

    .container {
      padding: 60px 20px;
    }

    h1 {
      font-size: 48px;
      background: linear-gradient(90deg, #c084fc, #9333ea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .subtitle {
      opacity: 0.7;
      letter-spacing: 3px;
      margin-bottom: 40px;
    }

    .btn {
      background: linear-gradient(90deg, #9333ea, #c084fc);
      border: none;
      padding: 14px 30px;
      border-radius: 30px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin: 10px;
      box-shadow: 0 0 20px rgba(147, 51, 234, 0.6);
      transition: 0.3s ease;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .file-input {
      margin: 10px;
    }

    .live-section {
      margin-top: 20px;
    }

    input[type="text"] {
      padding: 12px;
      width: 300px;
      border-radius: 20px;
      border: none;
      outline: none;
      background: #111;
      color: white;
      margin-right: 10px;
    }

    .video-box {
      margin: 50px auto;
      width: 80%;
      max-width: 900px;
      height: 450px;
      border-radius: 20px;
      background: #000;
      box-shadow: 0 0 40px rgba(147, 51, 234, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .placeholder {
      font-size: 18px;
      opacity: 0.5;
    }
  </style>
</head>

<body class="fade-in">

  <div class="hero">
    <h1>Simple Video Portal</h1>
    <div class="subtitle">AI SUBJECT TRACKING SYSTEM</div>

    <div class="cards">

      <div class="card" onclick="goTracker('webcam')">
        <h3>Webcam</h3>
        <p>Use your device camera</p>
      </div>

      <div class="card" onclick="goTracker('upload')">
        <h3>Upload</h3>
        <p>Select a video file</p>
      </div>

      <div class="card" onclick="goTracker('live')">
        <h3>Live Stream</h3>
        <p>Enter stream URL</p>
      </div>

    </div>
  </div>

  <script>
    function goTracker(type) {
      window.location.href = "tracker.html?source=" + type;
    }
  </script>

</body>
</html>
